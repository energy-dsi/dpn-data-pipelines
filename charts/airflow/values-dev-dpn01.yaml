namespace: ns-dpn-01

airflow:
  name: dpn-airflow  

  image:
    repository: <<CONTAINER_REGISTRY_URL>>/base/apache-airflow
    tag: "2.9.1"
    pullPolicy: Always

  dags:
    path: /opt/airflow/dags

  webserver:
    replicaCount: 1

    service:
      name: dpn-airflow-webserver
      type: LoadBalancer

      #annotations:
      #  service.beta.kubernetes.io/azure-load-balancer-internal: "true"
      internalLoadBalancer: true
      loadBalancerIP: <<your specific value>>
      
      port: 80
      targetPort: 8080

  scheduler:
    replicaCount: 1

  worker:
    replicaCount: 1

  triggerer:
    replicaCount: 1

# ===========================================
# Redis (Celery broker)
# ===========================================
redis:
  name: dpn-airflow-redis 
  replicaCount: 1

  image:
    repository: <<CONTAINER_REGISTRY_URL>>/base/redis
    tag: "7.2"
    pullPolicy: Always

  service:
    port: 6379
    type: ClusterIP

  args:
    - "--save"
    - "60 1"
    - "--appendonly"
    - "no"
    - "--loglevel"
    - "warning"

  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

postgres:
  name: dpn-airflow-postgres 
  replicaCount: 1

  image:
    repository: <<CONTAINER_REGISTRY_URL>>/base/postgres
    tag: "16-alpine"
    pullPolicy: Always

  service:
    port: 5432
    type: ClusterIP

  username: airflow
  db: airflow

  persistence:
    enabled: true
    claimName: dpn-airflow-postgres-pvc
    storageClassName: managed-csi
    size: 10Gi 
  resources:
    requests:
      cpu: "250m"
      memory: "1Gi"
    limits:
      cpu: "500m"
      memory: "2Gi"

monitoring:
  prometheus:
    image:
      repository: <<CONTAINER_REGISTRY_URL>>/base/prom-prometheus
      tag: "v2.52.0"

  grafana:
    image:
      repository: <<CONTAINER_REGISTRY_URL>>/base/grafana-grafana
      tag: "10.4.2"

  statsdExporter:
    image:
      repository: <<CONTAINER_REGISTRY_URL>>/base/prom-statsd-exporter
      tag: "v0.26.1"

config:
  executor: CeleryExecutor
  loadExamples: false
  dagsPausedAtCreation: true

  dagsFolder: /opt/airflow/dags 
  workerConcurrency: 4

  brokerUrl: redis://dpn-airflow-redis:6379/0

keyvault:
  clientID: <<your specific value>>
  name: <<your specific value>>
  tenantId: <<your specific value>>
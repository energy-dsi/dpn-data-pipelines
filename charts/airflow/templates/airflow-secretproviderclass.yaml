apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: dpn-airflow-kv-secrets
  namespace: {{ .Release.Namespace }}

spec:
  provider: azure

  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "{{ .Values.keyvault.clientID }}"
    keyvaultName: "{{ .Values.keyvault.name }}"
    tenantId: "{{ .Values.keyvault.tenantId }}"

    objects: |
      array:
        - |
          objectName: fernetKey        
          objectType: secret
        - |
          objectName: webSecretKey     
          objectType: secret
        - |
          objectName: airPostgresPassword 
          objectType: secret
        - |
          objectName: AIRFLOW-ADMIN-PASSWORD
          objectType: secret

  secretObjects:
    - secretName: dpn-airflow-secrets  
      type: Opaque
      data:
        - objectName: fernetKey
          key: FERNET_KEY
        - objectName: webSecretKey
          key: WEB_SECRET_KEY
        - objectName: airPostgresPassword
          key: POSTGRES_PASSWORD
        - objectName: AIRFLOW-ADMIN-PASSWORD
          key: AIRFLOW_ADMIN_PASSWORD
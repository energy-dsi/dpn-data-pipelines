apiVersion: v1
kind: Service
metadata:
  name: dpn-airflow-webserver-external
  namespace: {{ .Release.Namespace }}

  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"

spec:
  type: LoadBalancer
  {{- if .Values.airflow.webserver.service.loadBalancerIP }}
  loadBalancerIP: <<your specific value>>
  {{- end }}

  selector:
    app: dpn-airflow-webserver

  ports:
    - name: https
      port: 8080
      targetPort: 8080
      protocol: TCP
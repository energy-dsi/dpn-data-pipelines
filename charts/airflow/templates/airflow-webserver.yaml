apiVersion: apps/v1
kind: Deployment
metadata:
  name: dpn-airflow-webserver
  labels:
    app: dpn-airflow-webserver

spec:
  selector:
    matchLabels:
      app: dpn-airflow-webserver

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
      
  template:
    metadata:
      labels:
        app: dpn-airflow-webserver

    spec:
      containers:
        - name: dpn-airflow-webserver

          image: "{{ .Values.airflow.image.repository }}:{{ .Values.airflow.image.tag }}"
          imagePullPolicy: {{ .Values.airflow.image.pullPolicy }}

          command: ["airflow", "webserver"]

          ports:
            - containerPort: 8080

          envFrom:
            - configMapRef:
                name: dpn-airflow-config
            - secretRef:
                name: dpn-airflow-secrets      

          env:
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              value: "postgresql+psycopg2://{{ .Values.postgres.username }}:$(POSTGRES_PASSWORD)@$(AIRFLOW__DATABASE__HOST):$(AIRFLOW__DATABASE__PORT)/{{ .Values.postgres.db }}"

            - name: AIRFLOW__CELERY__RESULT_BACKEND
              value: "db+postgresql://{{ .Values.postgres.username }}:$(POSTGRES_PASSWORD)@$(AIRFLOW__DATABASE__HOST):$(AIRFLOW__DATABASE__PORT)/{{ .Values.postgres.db }}"

            - name: AIRFLOW__CORE__FERNET_KEY
              valueFrom:
                secretKeyRef:
                  name: dpn-airflow-secrets
                  key: FERNET_KEY

            - name: AIRFLOW__WEBSERVER__SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: dpn-airflow-secrets
                  key: WEB_SECRET_KEY

            # ---- Keycloak SSO login (webserver_config.py, AUTH_TYPE=AUTH_OAUTH) ----
            - name: "KEYCLOAK_INTERNAL_URL"
              value: {{ (.Values.oidc).keycloakInternalUrl | default "" | quote }}

            - name: "AIRFLOW_OIDC_CLIENT_ID"
              value: {{ (.Values.oidc).clientId | default "dpn-service-client" | quote }}

            # dpn-service-client's secret is now owned by dpn-authentication-service's
            # Keycloak chart (dpn-keycloak-secrets/KC_SERVICE_CLIENT_SECRET) rather than
            # independently pulled here as KAFKA-OAUTH-CLIENT-SECRET.
            - name: "AIRFLOW_OIDC_CLIENT_SECRET"
              valueFrom:
                secretKeyRef:
                  name: {{ (.Values.oidc).clientSecretName | default "dpn-keycloak-secrets" }}
                  key: {{ (.Values.oidc).clientSecretKey | default "KC_SERVICE_CLIENT_SECRET" }}

            - name: "REQUESTS_CA_BUNDLE"
              value: /etc/keycloak/certs/ca.crt

            # ---- Airflow webserver terminates TLS itself on its normal 8080
            # port - no reverse proxy in front of this pod. dpn-tls only carries
            # ca.crt/JKS truststores for outbound Kafka/Keycloak trust, so the
            # server cert/key come from dpn-health-tls instead: a real
            # kubernetes.io/tls Secret (PEM tls.crt/tls.key) whose SAN covers
            # *.ns-dpn-01.svc.cluster.local (both this Service and the external
            # LB's in-cluster DNS name). ----
            - name: "AIRFLOW__WEBSERVER__WEB_SERVER_SSL_CERT"
              value: /etc/airflow/tls/tls.crt

            - name: "AIRFLOW__WEBSERVER__WEB_SERVER_SSL_KEY"
              value: /etc/airflow/tls/tls.key

          volumeMounts:
          {{- range $path, $_ := .Files.Glob "dags/*.py" }}
            - name: dpn-airflow-dags
              mountPath: "/opt/airflow/dags/{{ base $path }}"
              subPath: "{{ base $path }}"
          {{- end }}

            - name: dpn-airflow-webserver-config
              mountPath: /opt/airflow/webserver_config.py
              subPath: webserver_config.py
              readOnly: true

            - name: dpn-tls
              mountPath: /etc/keycloak/certs
              readOnly: true

            - name: dpn-health-tls
              mountPath: /etc/airflow/tls
              readOnly: true

            - name: airflow-secrets-store
              mountPath: /mnt/secrets
              readOnly: true

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"

          securityContext:
            runAsUser: 50000
            runAsGroup: 50000
            runAsNonRoot: true
            allowPrivilegeEscalation: false

      volumes:
        - name: dpn-airflow-dags
          configMap:
            name: dpn-airflow-dags

        - name: dpn-airflow-webserver-config
          configMap:
            name: dpn-airflow-webserver-config

        - name: dpn-tls
          secret:
            secretName: {{ (.Values.kafka).tlsSecretName | default "dpn-tls" }}

        - name: dpn-health-tls
          secret:
            secretName: {{ (.Values.airflow.webserver).tlsSecretName | default "dpn-health-tls" }}

        - name: airflow-secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: dpn-airflow-kv-secrets

      automountServiceAccountToken: false

---
apiVersion: v1
kind: Service
metadata:
  name: dpn-airflow-webserver

spec:
  type: ClusterIP
  selector:
    app: dpn-airflow-webserver

  ports:
    - name: https
      port: 8080
      targetPort: 8080

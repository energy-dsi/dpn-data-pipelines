name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Select Environment
        required: true
        default: dev
        type: choice
        options:
          - dev
          - devtest
          - sit
          - preprod
          - prod

      cluster:
        description: Choose DPN Cluster
        required: true
        default: dpn01
        type: choice
        options:
          - dpn01
          - dpn02

      serviceConnection:
        description: Select Service Connection
        required: true
        default: gcp-dpn-dev-001
        type: choice
        options:
          - gcp-dpn-dev-001
          - gcp-dpn-dev-002
          - gcp-dpn-sit-001
          - gcp-dpn-preprod-001
          - gcp-dpn-prod-001

      configType:
        description: Select Config Type
        required: true
        type: choice
        options:
          - producer
          - consumer

      processType:
        description: Select Process Type
        required: true
        default: file
        type: choice
        options:
          - file

      productType:
        description: Enter Product Type
        required: true
        default: default

      schemaType:
        description: Enter Schema Type (eq/eqbd/ssh/dl..)
        required: true
        default: default

      imageTag:
        description: Image Tag To Deploy
        required: true

env:
  PROJECT_NAME: dsi-data-pipelines
  PARAMETERS_FILE: .pipelines/github-actions-pipelines/gcp-pipelines/config/${{ inputs.environment }}-${{ inputs.cluster }}.json
  PRODUCT_TYPE: ${{ inputs.productType }}
  SCHEMA_TYPE: ${{ inputs.schemaType }}
  PROCESS_TYPE: ${{ inputs.processType }}
  CONFIG_TYPE: ${{ inputs.configType }}
  IMAGE_TAG: ${{ inputs.imageTag }}  
  HELM_REPO_URL: https://raw.githubusercontent.com/helm/helm
  HELM_BRANCH: main
  HELM_SCRIPT: scripts/get-helm-3

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:

    - name: Checkout source
      uses: actions/checkout@v4

    # ===============================
    # READ ENV VARS FROM FILE
    # ===============================
    - name: Read Environment Variables
      shell: bash
      run: |
        set -euo pipefail
        echo "================================================="
        echo "READ ENV VARS FROM FILE"
        echo "================================================="

        if [ -f "$GITHUB_WORKSPACE/$PARAMETERS_FILE" ]; then
          echo "Reading parameters from $PARAMETERS_FILE"

          for param in $(jq -r 'keys_unsorted | .[]' "$GITHUB_WORKSPACE/$PARAMETERS_FILE"); do
            value=$(jq -r ".\"$param\"" "$GITHUB_WORKSPACE/$PARAMETERS_FILE")

            echo "$param=$value" >> $GITHUB_ENV
            echo "Set parameter $param with $value"
          done
        else
          echo "Error: $PARAMETERS_FILE not found!"
          exit 1
        fi

        echo "READ ENV VARS FROM FILE - OK"

    # ===============================
    # GCP AUTH (Replacement of AzureCLI task)
    # ===============================
    - name: Authenticate to GCP
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
        service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

    - name: Setup gcloud CLI
      uses: google-github-actions/setup-gcloud@v2

    # ===============================
    # INSTALL TOOLS
    # ===============================
    - name: Install Tools
      shell: bash
      run: |
        set -euo pipefail

        echo "================================================="
        echo "INSTALL TOOLS"
        echo "================================================="

        gcloud components install kubectl -q

        curl -sSL "$HELM_REPO_URL/$HELM_BRANCH/$HELM_SCRIPT" | bash

        kubectl version --client > /dev/null
        helm version > /dev/null

        echo "Tools installed"

    # ===============================
    # GKE CONTEXT (AKS -> GKE)
    # ===============================
    - name: Configure GKE Context
      shell: bash
      run: |
        set -euo pipefail

        echo "================================================="
        echo "GCP AUTH"
        echo "================================================="

        gcloud config set project $GCP_PROJECT_ID

        gcloud container clusters get-credentials \
          $GKE_CLUSTER \
          --region $GCP_REGION \
          --project $GCP_PROJECT_ID

        echo "GKE context ready"

    # ===============================
    # ARTIFACT REGISTRY LOGIN (ACR -> GAR)
    # ===============================
    - name: Authenticate to Artifact Registry
      shell: bash
      run: |
        set -euo pipefail

        gcloud auth configure-docker $GCP_REGION-docker.pkg.dev --quiet

    # ===============================
    # HELM DEPLOY (FULL LOGIC PRESERVED)
    # ===============================
    - name: Helm Deploy
      shell: bash
      run: |
        set -euo pipefail

        processCharts() {
        
          while IFS= read -r chart; do
            dir_path=$(dirname "$chart")

            CHART_LOCATION=$chart
            echo "CHART_LOCATION: $CHART_LOCATION"
            echo "DIR_PATH: $dir_path"

            base_name=$(basename "$dir_path")
            echo "BASE_NAME: $base_name"

            if [[ "$base_name" == *"schema_mapper"* ]]; then
                base_name="mapper"
                echo "Updated base_name: $base_name"
            fi

            PRODUCT_TYPE=$(echo "$PRODUCT_TYPE" | tr '_' '-')

            if [[ "$CONFIG_TYPE"  == "producer" ]]; then
              IMAGE_NAME="$CONFIG_TYPE-$PROCESS_TYPE-$base_name-$SCHEMA_TYPE"
              POD_NAME="dpn-$CONFIG_TYPE-$PROCESS_TYPE-$base_name-$PRODUCT_TYPE"
            elif [[ "$CONFIG_TYPE" == "consumer" ]]; then
              IMAGE_NAME="$CONFIG_TYPE-$PROCESS_TYPE-$base_name"
              POD_NAME="dpn-$CONFIG_TYPE-$PROCESS_TYPE-$base_name"
            fi

            echo "IMAGE_NAME: $IMAGE_NAME"
            echo "POD_NAME: $POD_NAME"

            PROJECT_NAME=$IMAGE_NAME

            echo "================================================="
            echo "HELM DEPLOY"
            echo "================================================="

            helm upgrade --install $PROJECT_NAME $CHART_LOCATION \
              --set namespace="$NAMESPACE",imageName="$IMAGE_NAME",imageTag="$IMAGE_TAG" \
              --set registry="$GAR_REPO",schemaType="$SCHEMA_TYPE",name="$POD_NAME",productType="$PRODUCT_TYPE" \
              -n $NAMESPACE

            echo "Helm deploy of $PROJECT_NAME OK"

          done < charts.txt
        }

        case "$CONFIG_TYPE" in
          "consumer") 
              echo "Consumer Organization"

              find $CONFIG_TYPE/$PROCESS_TYPE -name "charts" \
              -not -path "./blueprints/*" > charts.txt

              processCharts
              ;;

          "producer") 
              echo "Producer Organization"

              find $CONFIG_TYPE/$PROCESS_TYPE/${PRODUCT_TYPE,,} -name "charts" \
              -not -path "./blueprints/*" > charts.txt 

              processCharts
              ;;
        esac          

        rm charts.txt
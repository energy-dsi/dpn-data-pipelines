trigger:
- none

pool:
  name: '<<YOUR AGENT POOL>>'

parameters:
- name: environment
  displayName: 'Select Environment'
  type: string
  default: dev
  values:
    - dev
    - devtest
    - test
    - pdev
    - ptest
    - puat
- name: cluster
  displayName: 'Choose DPN Cluster'
  type: string
  default: dpn01
  values:
    - dpn01
    - dpn02
- name: ServiceConnection
  displayName: 'ServiceConnection details'
  type: string
  default: 'sc-dpn-dev-001'
  values:
    - sc-dpn-dev-001
    - sc-dpn-dev-002
    - sc-dpn-test-001
    - sc-dpn-test-002
    - sc-dpn-pdev-ppd-001
    - sc-dpn-ptest-ppd-001
    - sc-dpn-puat-ppd-001
- name: uninstallProducer
  displayName: 'Uninstall producer release(s)'
  type: boolean
  default: false
- name: uninstallConsumer
  displayName: 'Uninstall consumer release(s)'
  type: boolean
  default: false
- name: uninstallAirflow
  displayName: 'Uninstall airflow (dpn-airflow)'
  type: boolean
  default: false

# NOTE: this is the single uninstall pipeline for every environment.
# pdev/ptest/puat only have one DPN, so leave `cluster` at its default
# (dpn01) when targeting them -- PARAMETERS_FILE resolves to
# config/pdev-dpn01.json, etc.
#
# Tick any combination of the three checkboxes above (1, 2 or all 3).
# Only the ticked components are uninstalled; nothing else is touched.
variables:
  PARAMETERS_FILE: '.pipelines/azure-pipelines/config/${{ parameters.environment }}-${{ parameters.cluster }}.json'
  ${{ if in(parameters.environment, 'pdev', 'ptest', 'puat') }}:
    APPROVAL_GROUP: dsi-ppd
  ${{ else }}:
    APPROVAL_GROUP: dsi-devtest

stages:
# --------------------------------------------------
# Stage 0 — Pre-Uninstall Checklist
# --------------------------------------------------
- stage: Precheck
  displayName: 'Pre-Uninstall Checklist'
  jobs:
  - job: Precheck
    steps:
    - script: |
        echo "CONFIRM BEFORE PROCEEDING:"
        echo "1. Pipelines stopped"
        echo "2. No active file ingestion"
        echo "3. Kafka topics drained"
        echo "4. Backups taken if required"
      displayName: 'Checklist Acknowledgement'

    - script: |
        if [ "${{ parameters.uninstallProducer }}" != "True" ] && [ "${{ parameters.uninstallProducer }}" != "true" ] && \
           [ "${{ parameters.uninstallConsumer }}" != "True" ] && [ "${{ parameters.uninstallConsumer }}" != "true" ] && \
           [ "${{ parameters.uninstallAirflow }}" != "True" ] && [ "${{ parameters.uninstallAirflow }}" != "true" ]; then
          echo "##[error]Nothing selected — tick at least one of uninstallProducer / uninstallConsumer / uninstallAirflow before running."
          exit 1
        fi
        echo "Selected for uninstall:"
        [ "${{ parameters.uninstallProducer }}" = "True" ] || [ "${{ parameters.uninstallProducer }}" = "true" ] && echo "  - producer"
        [ "${{ parameters.uninstallConsumer }}" = "True" ] || [ "${{ parameters.uninstallConsumer }}" = "true" ] && echo "  - consumer"
        [ "${{ parameters.uninstallAirflow }}" = "True" ] || [ "${{ parameters.uninstallAirflow }}" = "true" ] && echo "  - airflow (dpn-airflow)"
        true
      displayName: 'Guard: at least one component selected'

# --------------------------------------------------
# Stage 1 — Load Config & AKS Auth
# --------------------------------------------------
- stage: Prepare
  displayName: 'Load Config & AKS Auth'
  dependsOn: Precheck
  jobs:
  - job: Prepare
    steps:
    - script: |
        set -e

        CONFIG_FILE="$(Build.SourcesDirectory)/$(PARAMETERS_FILE)"
        if [ ! -f "$CONFIG_FILE" ]; then
          echo "ERROR: Config file not found $CONFIG_FILE"
          exit 1
        fi

        echo "Loading environment variables"
        for key in $(jq -r 'keys_unsorted | .[]' "$CONFIG_FILE"); do
          value=$(jq -r ".\"$key\"" "$CONFIG_FILE")
          echo "##vso[task.setvariable variable=$key]$value"
        done
      displayName: 'Read Environment Variables'

    - task: AzureCLI@2
      displayName: 'AKS Authentication'
      inputs:
        azureSubscription: ${{ parameters.ServiceConnection }}
        scriptType: bash
        addSpnToEnvironment: true
        scriptLocation: inlineScript
        inlineScript: |
          set -euo pipefail

          az aks install-cli

          az aks get-credentials \
            --resource-group $(RESOURCE_GROUP) \
            --name $(AKS_CLUSTER) \
            --overwrite-existing

          kubelogin convert-kubeconfig -l azurecli

          echo "AKS context ready"


# -----------------------------
# Stage 2 — Approval
# -----------------------------
- stage: Approval
  displayName: "Approval – Confirm Deletion Scope"
  dependsOn: Prepare
  jobs:
  - deployment: ApproveUninstall
    displayName: "Approve DPN Helm Uninstall"
    ${{ if in(parameters.environment, 'pdev', 'ptest', 'puat') }}:
      environment: dsi-ppd
    ${{ else }}:
      environment: dsi-devtest
    strategy:
      runOnce:
        deploy:
          steps:
          - script: |
              echo "===================================================="
              echo "DPN PLATFORM UNINSTALL — APPROVAL REQUIRED"
              echo "===================================================="
              echo ""
              echo "Environment    : ${{ parameters.environment }}"
              echo "Approval Group : $(APPROVAL_GROUP)"
              echo ""
              echo "The following Helm releases WILL be deleted"
              echo "ONCE APPROVAL IS GRANTED:"
              echo ""
              echo "Selected components:"
              echo "  uninstallProducer = ${{ parameters.uninstallProducer }}"
              echo "  uninstallConsumer = ${{ parameters.uninstallConsumer }}"
              echo "  uninstallAirflow  = ${{ parameters.uninstallAirflow }}"
              echo ""
              echo "Nothing else in the namespace is touched."
              echo ""
            displayName: "Approval Context Header"

          - task: AzureCLI@2
            displayName: "Preview Helm Releases (READ‑ONLY)"
            inputs:
              azureSubscription: "${{ parameters.ServiceConnection }}"
              addSpnToEnvironment: true
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                az aks install-cli
                az aks get-credentials \
                  --resource-group $(RESOURCE_GROUP) \
                  --name $(AKS_CLUSTER) \
                  --overwrite-existing
                kubelogin convert-kubeconfig -l azurecli

                echo ""
                echo "Helm releases that will be deleted:"
                echo "----------------------------------------------------"

                if [ "${{ parameters.uninstallProducer }}" = "True" ] || [ "${{ parameters.uninstallProducer }}" = "true" ]; then
                  (helm list -n $(NAMESPACE) -q | grep -E '^producer' || echo "No producer release found")
                fi
                if [ "${{ parameters.uninstallConsumer }}" = "True" ] || [ "${{ parameters.uninstallConsumer }}" = "true" ]; then
                  (helm list -n $(NAMESPACE) -q | grep -E '^consumer' || echo "No consumer release found")
                fi
                if [ "${{ parameters.uninstallAirflow }}" = "True" ] || [ "${{ parameters.uninstallAirflow }}" = "true" ]; then
                  helm status dpn-airflow -n $(NAMESPACE) >/dev/null 2>&1 && echo "dpn-airflow" || echo "dpn-airflow not installed"
                fi

                echo ""
                echo "----------------------------------------------------"
                echo "NO resources have been deleted in this stage."
                echo "Deletion will occur ONLY after approval."
                echo "===================================================="

# -----------------------------
# Stage 3 — Helm Uninstall
# -----------------------------
- stage: Uninstall
  dependsOn: Approval
  jobs:
  - job: Uninstall
    steps:
    - script: |
        CONFIG_FILE="$(Build.SourcesDirectory)/$(PARAMETERS_FILE)"
        for key in $(jq -r 'keys_unsorted | .[]' "$CONFIG_FILE"); do
          echo "##vso[task.setvariable variable=$key]$(jq -r ".\"$key\"" "$CONFIG_FILE")"
        done
      displayName: 'Reload Environment Variables'

    - task: AzureCLI@2
      displayName: 'Helm Uninstall'
      inputs:
        azureSubscription: ${{ parameters.ServiceConnection }}
        addSpnToEnvironment: true
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -euo pipefail

          az aks get-credentials \
            --resource-group $(RESOURCE_GROUP) \
            --name $(AKS_CLUSTER) \
            --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli

          # Producer release(s) — only if ticked
          if [ "${{ parameters.uninstallProducer }}" = "True" ] || [ "${{ parameters.uninstallProducer }}" = "true" ]; then
            while IFS= read -r Release; do
              [ -z "$Release" ] && continue
              echo "Uninstalling $Release"
              helm uninstall "$Release" -n $(NAMESPACE)
            done < <(helm list -n $(NAMESPACE) -q | grep -E '^producer' || true)
          fi

          # Consumer release(s) — only if ticked
          if [ "${{ parameters.uninstallConsumer }}" = "True" ] || [ "${{ parameters.uninstallConsumer }}" = "true" ]; then
            while IFS= read -r Release; do
              [ -z "$Release" ] && continue
              echo "Uninstalling $Release"
              helm uninstall "$Release" -n $(NAMESPACE)
            done < <(helm list -n $(NAMESPACE) -q | grep -E '^consumer' || true)
          fi

          # Airflow release (fixed name) — only if ticked
          if [ "${{ parameters.uninstallAirflow }}" = "True" ] || [ "${{ parameters.uninstallAirflow }}" = "true" ]; then
            if helm status dpn-airflow -n $(NAMESPACE) >/dev/null 2>&1; then
              echo "Uninstalling dpn-airflow"
              helm uninstall dpn-airflow -n $(NAMESPACE)
            else
              echo "dpn-airflow not installed, skipping"
            fi
          fi
# -----------------------------
# Stage 4 — Verify
# -----------------------------
- stage: Verify
  displayName: 'Final Verification'
  dependsOn: Uninstall
  jobs:
  - job: Verify
    steps:
    - script: |
        set -e

        CONFIG_FILE="$(Build.SourcesDirectory)/$(PARAMETERS_FILE)"
        if [ ! -f "$CONFIG_FILE" ]; then
          echo "ERROR: Config file not found: $CONFIG_FILE"
          exit 1
        fi

        for key in $(jq -r 'keys_unsorted | .[]' "$CONFIG_FILE"); do
          value=$(jq -r ".\"$key\"" "$CONFIG_FILE")
          echo "##vso[task.setvariable variable=$key]$value"
          echo "Loaded $key=$value"
        done
      displayName: 'Load Environment Variables'

    - task: AzureCLI@2
      displayName: 'AKS Authentication'
      inputs:
        azureSubscription: ${{ parameters.ServiceConnection }}
        addSpnToEnvironment: true
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -euo pipefail

          az aks install-cli
          az aks get-credentials \
            --resource-group $(RESOURCE_GROUP) \
            --name $(AKS_CLUSTER) \
            --overwrite-existing

          kubelogin convert-kubeconfig -l azurecli

    - script: |
        echo "Using namespace: $(NAMESPACE)"

        echo "Deployments:"
        kubectl get deployments -n $(NAMESPACE)

        echo "Pods:"
        kubectl get pods -n $(NAMESPACE)

        echo "Helm Releases:"
        helm list -n $(NAMESPACE)

        echo "Services preserved:"
        kubectl get svc -n $(NAMESPACE)
      displayName: 'Verification'

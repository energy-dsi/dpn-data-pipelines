# Rollback pipeline for the self-service architecture on AKS — the
# dpn-self-service-scoped equivalent of dpn-data-pipeline-rollback.yaml
# (that one targets ns-dpn-01 via the shared per-schema-type config JSON's
# NAMESPACE key — the old architecture's namespace, not where
# dpn-self-service lives).
#
# Hardcodes namespace=ns-dpn-dp-01 and offers a release_name dropdown
# scoped to the 3 releases dpn-self-service-ci/cd.yaml actually manage via
# Helm — dpn-self-service itself, and the two consumer singletons.
# Dynamically-created producer Deployments (service/k8s_ops.py) are
# plain kubectl objects, not Helm releases, so there is nothing to roll
# back for those here — stopping/restarting a specific data product is a
# self-service UI action (Stop/Start), not a pipeline operation.

trigger: none

pool:
  name: <<YOUR AGENT POOL>>

parameters:
- name: ServiceConnection
  displayName: 'ServiceConnection details'
  type: string
  default: 'sc-dpn-dev-001'
  values:
    - sc-dpn-dev-001
    - sc-dpn-dev-002
    - sc-dpn-test-001
    - sc-dpn-test-002
    - sc-dpn-pdev-ppd-001
    - sc-dpn-ptest-ppd-001
    - sc-dpn-puat-ppd-001
- name: environment
  displayName: 'Select Environment'
  type: string
  default: dev
  values:
    - dev
    - devtest
    - test
    - pdev
    - ptest
    - puat
- name: cluster
  displayName: 'Choose DPN Cluster'
  type: string
  default: dpn01
  values:
    - dpn01
    - dpn02
- name: release_name
  displayName: 'Helm release to roll back'
  type: string
  default: dpn-self-service
  values:
    - dpn-self-service
    - dpn-consumer-file-extractor
    - dpn-consumer-topic-extractor

variables:
- name: PARAMETERS_FILE
  value: '.pipelines/azure-pipelines/config/${{ parameters.environment }}-${{ parameters.cluster }}.json'
- name: PRODUCER_NAMESPACE
  value: ns-dpn-dp-01
- name: selected_revision
  value: ""
- ${{ if eq(parameters.environment, 'dev') }}:
  - name: APPROVAL_GROUP
    value: dsi-dev
- ${{ elseif eq(parameters.environment, 'devtest') }}:
  - name: APPROVAL_GROUP
    value: dsi-devtest
- ${{ elseif eq(parameters.environment, 'test') }}:
  - name: APPROVAL_GROUP
    value: dsi-test
- ${{ else }}:
  - name: APPROVAL_GROUP
    value: dsi-ppd

stages:
# -----------------------------------------------------
# Stage 1 — Prepare (Load Config & AKS Auth)
# -----------------------------------------------------
- stage: Prepare
  jobs:
  - job: Prepare
    steps:
    - script: |
        for k in $(jq -r 'keys_unsorted | .[]' "$(Build.SourcesDirectory)/$(PARAMETERS_FILE)"); do
          echo "##vso[task.setvariable variable=$k]$(jq -r ".\"$k\"" "$(Build.SourcesDirectory)/$(PARAMETERS_FILE)")"
        done
      displayName: 'Read Environment Variables'

    - task: AzureCLI@2
      displayName: 'AKS Auth'
      inputs:
        azureSubscription: ${{ parameters.ServiceConnection }}
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -euo pipefail

          KUBECTL_VERSION="v1.32.4"
          KUBELOGIN_VERSION="v0.1.4"
          HELM_VERSION="v3.17.3"

          command -v kubectl &>/dev/null || az aks install-cli --client-version ${KUBECTL_VERSION} --kubelogin-version ${KUBELOGIN_VERSION}
          command -v kubelogin &>/dev/null || az aks install-cli --client-version ${KUBECTL_VERSION} --kubelogin-version ${KUBELOGIN_VERSION}
          command -v helm &>/dev/null || curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | DESIRED_VERSION=${HELM_VERSION} bash

          az aks get-credentials --resource-group $(RESOURCE_GROUP) --name $(AKS_CLUSTER) --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli

# -----------------------------------------------------
# Stage 2 — Discover Revisions
# -----------------------------------------------------
- stage: DiscoverRevisions
  dependsOn: Prepare
  jobs:
  - job: ShowRevisions
    steps:
    - script: |
        for k in $(jq -r 'keys_unsorted | .[]' "$(Build.SourcesDirectory)/$(PARAMETERS_FILE)"); do
          echo "##vso[task.setvariable variable=$k]$(jq -r ".\"$k\"" "$(Build.SourcesDirectory)/$(PARAMETERS_FILE)")"
        done

    - task: AzureCLI@2
      name: setRevisions
      displayName: "Fetch Last 5 Helm Revisions"
      inputs:
        azureSubscription: ${{ parameters.ServiceConnection }}
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -euo pipefail

          az aks get-credentials --resource-group $(RESOURCE_GROUP) --name $(AKS_CLUSTER) --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli

          REV_LIST=$(helm history ${{ parameters.release_name }} -n $(PRODUCER_NAMESPACE) -o json | jq -r '
            .[-5:][] |
            "Revision: \(.revision) | Status: \(.status) | Updated: \(.updated)"
          ')

          echo "Last 5 revisions of ${{ parameters.release_name }}:"
          echo "$REV_LIST"

          REV_LIST_ESCAPED=$(echo "$REV_LIST" | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "##vso[task.setvariable variable=revision_list;isOutput=true]$REV_LIST_ESCAPED"

# -----------------------------------------------------
# Stage 3 — Approval
# -----------------------------------------------------
- stage: Approval
  dependsOn: DiscoverRevisions
  variables:
    revision_list: $[ stageDependencies.DiscoverRevisions.ShowRevisions.outputs['setRevisions.revision_list'] ]
  jobs:
  - job: WaitForSelection
    pool: server
    steps:
    - task: ManualValidation@0
      inputs:
        instructions: |
          Last 5 Helm revisions of ${{ parameters.release_name }} in $(PRODUCER_NAMESPACE):

          $(revision_list)

          Set:

            selected_revision = <revision_number>

          If not provided, the previous stable (deployed/superseded)
          revision will be used automatically.

# -----------------------------------------------------
# Stage 4 — Rollback
# -----------------------------------------------------
- stage: Rollback
  dependsOn: Approval
  jobs:
  - deployment: RollbackJob
    ${{ if eq(parameters.environment, 'dev') }}:
      environment: dsi-dev
    ${{ elseif eq(parameters.environment, 'devtest') }}:
      environment: dsi-devtest
    ${{ elseif eq(parameters.environment, 'test') }}:
      environment: dsi-test
    ${{ else }}:
      environment: dsi-ppd
    strategy:
      runOnce:
        deploy:
          steps:
          - script: |
              for k in $(jq -r 'keys_unsorted | .[]' "$(Build.SourcesDirectory)/$(PARAMETERS_FILE)"); do
                echo "##vso[task.setvariable variable=$k]$(jq -r ".\"$k\"" "$(Build.SourcesDirectory)/$(PARAMETERS_FILE)")"
              done

          - task: AzureCLI@2
            displayName: "Execute Safe Rollback"
            inputs:
              azureSubscription: ${{ parameters.ServiceConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                az aks get-credentials --resource-group $(RESOURCE_GROUP) --name $(AKS_CLUSTER) --overwrite-existing
                kubelogin convert-kubeconfig -l azurecli

                if [ -z "$(selected_revision)" ]; then
                  echo "No revision selected, picking previous stable"
                  REV=$(helm history ${{ parameters.release_name }} -n $(PRODUCER_NAMESPACE) -o json | jq -r '
                    map(select(.status=="deployed" or .status=="superseded")) | .[-2].revision
                  ')
                else
                  REV=$(selected_revision)
                fi

                echo "Selected revision: $REV"

                STATUS=$(helm history ${{ parameters.release_name }} -n $(PRODUCER_NAMESPACE) -o json | jq -r "
                  .[] | select(.revision == ($REV|tonumber)) | .status
                ")
                echo "Status: $STATUS"

                if [[ "$STATUS" != "deployed" && "$STATUS" != "superseded" ]]; then
                  echo "Rollback blocked: invalid revision"
                  exit 1
                fi

                echo "Dry run"
                helm rollback ${{ parameters.release_name }} $REV -n $(PRODUCER_NAMESPACE) --dry-run

                echo "Executing rollback"
                helm rollback ${{ parameters.release_name }} $REV \
                  -n $(PRODUCER_NAMESPACE) \
                  --wait \
                  --timeout 10m

# -----------------------------------------------------
# Stage 5 — Verify
# -----------------------------------------------------
- stage: Verify
  dependsOn: Rollback
  jobs:
  - job: Verify
    steps:
    - script: |
        for k in $(jq -r 'keys_unsorted | .[]' "$(Build.SourcesDirectory)/$(PARAMETERS_FILE)"); do
          echo "##vso[task.setvariable variable=$k]$(jq -r ".\"$k\"" "$(Build.SourcesDirectory)/$(PARAMETERS_FILE)")"
        done

    - task: AzureCLI@2
      displayName: 'Verify'
      inputs:
        azureSubscription: ${{ parameters.ServiceConnection }}
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -euo pipefail

          az aks get-credentials --resource-group $(RESOURCE_GROUP) --name $(AKS_CLUSTER) --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli

          echo "Helm status"
          helm status ${{ parameters.release_name }} -n $(PRODUCER_NAMESPACE)

          echo "Recent revisions"
          helm history ${{ parameters.release_name }} -n $(PRODUCER_NAMESPACE) | tail -n 3

          echo "Pods"
          kubectl get pods -n $(PRODUCER_NAMESPACE)

# ============================================================
# Kafka Configuration (Source Cluster)
# ============================================================
bootstrapServer: dpn-kafka-target.ns-dpn-01.svc.cluster.local:9092 # Kafka broker endpoint (local setup)
# ============================================================
# Kafka Security (SASL/TLS — SASL_SSL + SASL_OAUTHBEARER/Keycloak)
# build_kafka_client_config() reads these KAFKA_*/KAFKA_OAUTH_* vars.
# See README.md "Kafka Authentication" section for full details.
# ============================================================
KAFKA_SECURITY_PROTOCOL: SASL_SSL # SASL authentication over TLS (set to SSL or PLAINTEXT to opt out)
KAFKA_SASL_MECHANISM: OAUTHBEARER # OAuth2 client-credentials via Keycloak
KAFKA_OAUTH_CLIENT_ID: dpn-service-client # Keycloak service-account client
# Must be the plain dpn-keycloak ClusterIP Service, not dpn-keycloak-service-lb:
# Keycloak stamps the token's `iss` claim from whichever hostname the client
# used to reach it, and the Kafka broker's OAuth validator is configured to
# expect issuer https://dpn-keycloak.ns-dpn-01.svc.cluster.local:8443/realms/
# dpn-realm — fetching via the LB hostname instead produces a token the
# broker rejects with SASL invalid_token (confirmed against a running broker).
KAFKA_OAUTH_TOKEN_ENDPOINT_URL: https://dpn-keycloak.ns-dpn-01.svc.cluster.local:8443/realms/dpn-realm/protocol/openid-connect/token
kafkaTlsSecretName: dpn-tls
kafkaOauthSecretName: dpn-keycloak-secrets
# TRUSTSTORE_PASSWORD/KEYSTORE_PASSWORD for dpn-tls's truststore.jks/
# keystore.jks — a separate secret from kafkaOauthSecretName above (which
# still holds KC_SERVICE_CLIENT_SECRET, the Kafka OAuth client secret).
tlsAuthSecretName: tls-auth-secret

# No mapper topic any more — this container absorbed the old schema_mapper
# entirely (see main.py's v2.0.0 changelog): each message's own target
# topic is resolved dynamically from its producer-stamped headers and
# produced to straight from here, no dp-consumer-topic-trfm relay.
srcTopicName: dp-consumer-topic-stage # Source topic consumed by extractor
srcGroupId: consumer-topic-extractor # Consumer group ID

# ============================================================
# Deployment Identity
# ============================================================
namespace: ns-dpn-01 # Kubernetes namespace
name: dpn-consumer-topic-extractor # Service/deployment name
imageRegistry: "" # Full registry path, e.g. <acr>.azurecr.io/dsi — set at deploy time
imageName: dpn-consumer-topic-extractor # Container image name (as pushed by dpn-self-service-ci)
imageTag: "" # Set at deploy time

# ============================================================
# Pipeline Configuration
# ============================================================
PRODUCT_NAME: consumer-topic # Logical product name used in logs/messages

OTEL_EXPORTER_OTLP_ENDPOINT: dpn-otel-collector.ns-dpn-health-01.svc.cluster.local:4318
OTEL_EXPORTER_OTLP_INSECURE: false
OTEL_OAUTH_DISABLED: false  # set true to skip OAuth in dev/test

# dpn_observability_sdk.heartbeat.HeartbeatLogger's own 5-minute default.
HEARTBEAT_INTERVAL_SECONDS: 60

# interval, not kafka-trigger: this self-service deployment has no Airflow
# (or any other orchestrator) publishing to PIPELINE_CONTROL_TOPIC, so
# kafka-trigger left this pod waiting forever for a trigger that never
# comes — "automatic" mode never actually ran a cycle. IntervalBackend
# self-ticks every scheduleInterval seconds instead.
SCHEDULER_BACKEND: interval # Execution backend (interval — no Airflow in this deployment)
# Starting default only — the self-service UI's Pause/Resume toggle (see
# service/consumers.py) patches this Deployment's actual EXECUTION_MODE
# in place at runtime, independent of this chart value.
EXECUTION_MODE: automatic

# Matches TOPIC_TASK_TIMEOUT_SECS below, and matches every self-service-
# created topic-pathway producer's effective cadence (service/env_builder.py's
# topic_adaptor_env() never overrides scheduleInterval at all, leaving
# IntervalBackend's own 60s default — see utils/scheduler_backend.py).
# This chart previously hardcoded 240 here, independent of the 60s window
# below: since run_window() already blocks for TOPIC_TASK_TIMEOUT_SECS
# before returning, and the `schedule` library computes each tick as
# last_run + scheduleInterval (not "N seconds after the job returns"), a
# scheduleInterval bigger than the window leaves a real idle gap after
# every window with nothing consuming (confirmed live: a 240/60 split
# produced only a ~20% duty cycle — 60s active out of every 300s). Setting
# it equal to the window means each tick's scheduled time has already
# elapsed by the time the job returns, so the next window starts
# immediately instead of waiting out the rest of a 240s timer.
scheduleInterval: 60 # Execution interval (seconds, only for interval mode)
replicaCount: 1 # Number of pod replicas

# ============================================================
# Kafka Control Topics
# ============================================================
PIPELINE_CONTROL_TOPIC: dpn-pipeline-control # Topic to trigger pipeline
PIPELINE_STATUS_TOPIC: dpn-pipeline-status # Topic to publish status updates

# ============================================================
# Runtime Configuration
# ============================================================
DRAIN_IDLE_SECS: 15 # Idle time before stopping consumption
TOPIC_TASK_TIMEOUT_SECS: 60 # Max execution time per run

# ============================================================
# Monitoring Configuration
# ============================================================
statsdPort: 8125 # StatsD metrics port

# ============================================================
# OpenTelemetry (Tracing & Metrics)
# ============================================================
SERVICE_NAME: dpn data pipeline          # Service name for observability
SERVICE_VERSION: 1.0.0               # Service version

consumerRetryDelaySecs: 5

# Bounds the per-cycle producer.flush() call (see main.py's _forward()/
# run_window()) — without a bound, flush() blocks forever on an
# undelivered backlog (e.g. a just-created dpn-consumer-*-target topic
# still propagating leader metadata), freezing the extractor's single-
# threaded scheduler loop permanently with no crash/restart to signal it.
producerFlushTimeoutSecs: 10

ENVIRONMENT: development

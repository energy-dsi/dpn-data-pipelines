# ============================================================
# Kafka Configuration (Source Cluster)
# ============================================================
bootstrapServer: dpn-kafka-target:9092   # Kafka broker endpoint (local setup)

mapperTopicName: dpn-consumer-topic-trfm   # Topic for transformed/mapper data
srcTopicName: dpn-consumer-topic-stage      # Source topic consumed by adaptor
srcGroupId: consumer_topic_eqbd_pg_gas_test   # Consumer group ID


# ============================================================
# Deployment Identity
# ============================================================
namespace: ns-dpn-01   # Kubernetes namespace
name: dpn-consumer-topic-eq-neso-oil-adaptor   # Service/deployment name
imageName: consumer-topic-eq-neso-oil-adaptor  # Container image name


# ============================================================
# Pipeline Configuration
# ============================================================
PRODUCT_NAME: consumer-topic   # Logical product name used in logs/messages

SCHEDULER_BACKEND: kafka-trigger   # Execution backend (kafka-trigger recommended)
EXECUTION_MODE: manual             # manual = disabled automatic execution

scheduleInterval: 240   # Execution interval (seconds, only for interval mode)
replicaCount: 1         # Number of pod replicas


# ============================================================
# Kafka Control Topics
# ============================================================
PIPELINE_CONTROL_TOPIC: dpn-pipeline-control   # Topic to trigger pipeline
PIPELINE_STATUS_TOPIC: dpn-pipeline-status     # Topic to publish status updates


# ============================================================
# Runtime Configuration
# ============================================================
DRAIN_IDLE_SECS: 15         # Idle time before stopping consumption
TOPIC_TASK_TIMEOUT_SECS: 60 # Max execution time per run


# ============================================================
# Monitoring Configuration
# ============================================================
statsdPort: 8125   # StatsD metrics port


# ============================================================
# OpenTelemetry (Tracing & Metrics)
# ============================================================
SERVICE_NAME: data-pipeline          # Service name for observability
SERVICE_VERSION: 1.0.0               # Service version
OTEL_EXPORTER_OTLP_ENDPOINT: dpn-otel-collector.ns-dpn-health-01.svc.cluster.local:4317   # OTEL collector endpoint

consumerRetryDelaySecs: 5

OTEL_EXPORTER_OTLP_PROTOCOL: grpc
OTEL_EXPORTER_OTLP_INSECURE: true
ENVIRONMENT: development
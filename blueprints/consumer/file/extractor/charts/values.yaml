namespace: ns-dpn-01
name: dpn-consumer-file-extractor
cloudProviderType: azure
acrName: ""
imageName: consumer-file-extractor
imageTag: ""
bootstrapServer: dpn-kafka-target.ns-dpn-01.svc.cluster.local:9092
# ============================================================
# Kafka Security (SASL/TLS — SASL_SSL + SASL_OAUTHBEARER/Keycloak)
# build_kafka_client_config() reads these KAFKA_*/KAFKA_OAUTH_* vars.
# See README.md "Kafka Authentication" section for full details.
# ============================================================
KAFKA_SECURITY_PROTOCOL: SASL_SSL # SASL authentication over TLS (set to SSL or PLAINTEXT to opt out)
KAFKA_SASL_MECHANISM: OAUTHBEARER # OAuth2 client-credentials via Keycloak
KAFKA_OAUTH_CLIENT_ID: dpn-service-client # Keycloak service-account client
# Must be the plain dpn-keycloak ClusterIP Service, not dpn-keycloak-service-lb:
# Keycloak stamps the token's `iss` claim from whichever hostname the client
# used to reach it, and the Kafka broker's OAuth validator is configured to
# expect issuer https://dpn-keycloak.ns-dpn-01.svc.cluster.local:8443/realms/
# dpn-realm — fetching via the LB hostname instead produces a token the
# broker rejects with SASL invalid_token (confirmed against a running broker).
KAFKA_OAUTH_TOKEN_ENDPOINT_URL: https://dpn-keycloak.ns-dpn-01.svc.cluster.local:8443/realms/dpn-realm/protocol/openid-connect/token
kafkaTlsSecretName: dpn-tls
kafkaOauthSecretName: dpn-keycloak-secrets

# No staging container/mapper topic any more — this container absorbed
# the old schema_mapper entirely (see main.py's v2.0.0 changelog): files
# move srcContainerName -> targetContainerName directly, one Kafka event
# per file published straight to targetTopicName.
srcContainerName: dp-consumer-stage
storageConnectionSecret: consumer-file-dp-secret
targetTopicName: dp-consumer-file-target
targetContainerName: dp-consumer-target
scheduleInterval: 60 # schedule interval in seconds

# ------- AWS Config ------------
# Values that vary by environment (region, MinIO/S3 endpoint) come from a
# ConfigMap (templates/configmap.yaml), not baked directly into the
# Deployment's env as literals — so ops can `kubectl edit configmap
# <name>-aws-config` + restart the pod to change them without a helm
# upgrade. awsEndpointUrl/awsRegion below are what populates that
# ConfigMap at install time; override them per environment the same way
# as any other value here.
awsEndpointUrl: "<<your specific value>>"
awsRegion: eu-west-2
awsAccessSecret: aws-access-secret

# Scheduler / Execution
SCHEDULER_BACKEND: kafka-trigger
# Automatic only — both consumer pipelines are, on request; there is no
# manual/"Run Now" mode any more (that UI/route was removed entirely, not
# just disabled — see service/consumers.py, ui/app.py, and
# ui/templates/consumers.html).
EXECUTION_MODE: automatic
replicaCount: 1

# Pipeline Control Topics
PIPELINE_CONTROL_TOPIC: dpn-pipeline-control
PIPELINE_STATUS_TOPIC: dpn-pipeline-status

# Runtime Config
DRAIN_IDLE_SECS: 15
topicTaskTimeoutSecs: 60

# Monitoring
STATSD_PORT: 8125

# OpenTelemetry
SERVICE_NAME: dpn data pipeline
SERVICE_VERSION: 1.0.0
PRODUCT_NAME: consumer-file

OTEL_EXPORTER_OTLP_ENDPOINT: dpn-otel-collector.ns-dpn-health-01.svc.cluster.local:4318
OTEL_EXPORTER_OTLP_INSECURE: false
OTEL_OAUTH_DISABLED: false  # set true to skip OAuth in dev/test

ENVIRONMENT: development

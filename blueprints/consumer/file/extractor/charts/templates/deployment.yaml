apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.name }}
spec:
  selector: 
    matchLabels:
      app: {{ .Values.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.name }}
    spec:
      restartPolicy: Always
      containers:
        - name: {{ .Values.name }}
          image: "{{ .Values.imageRegistry }}/{{ .Values.imageName }}:{{ .Values.imageTag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy | default "Always" }}
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              # 512Mi, not 256Mi: limit == request left zero burst headroom,
              # and this pod was observed OOMKilled (exit 137) twice in ~30
              # minutes even while idle between kafka-trigger cycles — let
              # alone once it's actually doing list_files()/file_copy() work
              # every interval tick.
              memory: "512Mi"
              cpu: "200m"
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
            runAsUser: 10000
            runAsNonRoot: true
          command: ['python', 'main.py']
          env:
          - name: "scheduleInterval"
            value: {{ .Values.scheduleInterval | quote }}
          - name: "cloudProviderType"
            value: {{ .Values.cloudProviderType }}
          - name: "srcConnectionString"
            valueFrom:
              secretKeyRef:
                name: {{ .Values.storageConnectionSecret }}
                key: SRC_CONNECTION_STRING
                optional: true
          - name: "srcContainerName"
            value: {{ .Values.srcContainerName }}
          - name: "bootstrapServer"
            value: {{ .Values.bootstrapServer }}
          - name: "KAFKA_SECURITY_PROTOCOL"
            value: {{ .Values.KAFKA_SECURITY_PROTOCOL }}
          - name: "KAFKA_SASL_MECHANISM"
            value: {{ .Values.KAFKA_SASL_MECHANISM }}
          - name: "KAFKA_OAUTH_CLIENT_ID"
            value: {{ .Values.KAFKA_OAUTH_CLIENT_ID }}
          - name: "KAFKA_OAUTH_CLIENT_SECRET"
            valueFrom:
              secretKeyRef:
                name: {{ .Values.kafkaOauthSecretName | default "dpn-keycloak-secrets" }}
                key: KC_SERVICE_CLIENT_SECRET
          - name: "KAFKA_OAUTH_TOKEN_ENDPOINT_URL"
            value: {{ .Values.KAFKA_OAUTH_TOKEN_ENDPOINT_URL }}
          - name: "targetConnectionString"
            valueFrom:
              secretKeyRef:
                name: {{ .Values.storageConnectionSecret }}
                key: TARGET_CONNECTION_STRING
                optional: true
          - name: "targetTopicName"
            value: {{ .Values.targetTopicName }}
          - name: "targetContainerName"
            value: {{ .Values.targetContainerName }}
          - name: "AWS_ENDPOINT_URL"
            valueFrom:
              configMapKeyRef:
                name: {{ .Values.name }}-aws-config
                key: AWS_ENDPOINT_URL
          - name: "AWS_REGION"
            valueFrom:
              configMapKeyRef:
                name: {{ .Values.name }}-aws-config
                key: AWS_REGION
          - name: "AWS_ACCESS_KEY_ID"
            valueFrom:
              secretKeyRef:
                name: {{ .Values.awsAccessSecret }}
                key: AWS_ACCESS_KEY_ID
                optional: true
          - name: "AWS_SECRET_ACCESS_KEY"
            valueFrom:
              secretKeyRef:
                name: {{ .Values.awsAccessSecret }}
                key: AWS_SECRET_ACCESS_KEY
                optional: true
                
          - name: "SCHEDULER_BACKEND"
            value: {{ .Values.SCHEDULER_BACKEND | quote }}

          - name: "EXECUTION_MODE"
            value: {{ .Values.EXECUTION_MODE | quote }}

          - name: "PIPELINE_CONTROL_TOPIC"
            value: {{ .Values.PIPELINE_CONTROL_TOPIC | quote }}

          - name: "PIPELINE_STATUS_TOPIC"
            value: {{ .Values.PIPELINE_STATUS_TOPIC | quote }}

          - name: "DRAIN_IDLE_SECS"
            value: {{ .Values.DRAIN_IDLE_SECS | quote }}

          - name: "topicTaskTimeoutSecs"
            value: {{ .Values.topicTaskTimeoutSecs | quote }}

          - name: "STATSD_PORT"
            value: {{ .Values.STATSD_PORT | quote }}

          - name: "SERVICE_NAME"
            value: {{ .Values.SERVICE_NAME | quote }}

          - name: "SERVICE_VERSION"
            value: {{ .Values.SERVICE_VERSION | quote }}

          - name: "replicaCount"
            value: {{ .Values.replicaCount | quote }}

          - name: "PRODUCT_NAME"
            value: {{ .Values.PRODUCT_NAME }}
          
          - name: "OTEL_EXPORTER_OTLP_ENDPOINT"
            value: {{ .Values.OTEL_EXPORTER_OTLP_ENDPOINT | quote }}
          
          - name: "OTEL_EXPORTER_OTLP_INSECURE"
            value: {{ .Values.OTEL_EXPORTER_OTLP_INSECURE | quote }}

          - name: "OTEL_OAUTH_DISABLED"
            value: {{ .Values.OTEL_OAUTH_DISABLED | quote }}

          - name: "HEARTBEAT_INTERVAL_SECONDS"
            value: {{ .Values.HEARTBEAT_INTERVAL_SECONDS | quote }}

          - name: "TRUSTSTORE_PASSWORD"
            valueFrom:
              secretKeyRef:
                name: {{ .Values.tlsAuthSecretName | default "tls-auth-secret" }}
                key: TRUSTSTORE_PASSWORD
          - name: "KEYSTORE_PASSWORD"
            valueFrom:
              secretKeyRef:
                name: {{ .Values.tlsAuthSecretName | default "tls-auth-secret" }}
                key: KEYSTORE_PASSWORD
          
          - name: "ENVIRONMENT"
            value: {{ .Values.ENVIRONMENT }}
          

          volumeMounts:
            - name: dpn-tls
              mountPath: /etc/secrets/truststore.jks
              subPath: truststore.jks
              readOnly: true
            - name: dpn-tls
              mountPath: /etc/secrets/keystore.jks
              subPath: keystore.jks
              readOnly: true

      volumes:
        - name: dpn-tls
          secret:
            secretName: {{ .Values.kafkaTlsSecretName | default "dpn-tls" }}

      automountServiceAccountToken: false
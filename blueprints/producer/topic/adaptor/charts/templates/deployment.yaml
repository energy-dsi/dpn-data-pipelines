apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.name }}
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: {{ .Values.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.name }}
    spec:
      restartPolicy: Always
      containers:
        - name: {{ .Values.name }}
          image: "{{ .Values.acrName }}.azurecr.io/dsi/{{ .Values.imageName }}:{{ .Values.imageTag }}"
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
            runAsUser: 10000
            runAsNonRoot: true
          command: ['python', 'main.py']
          env:
            - name: "bootstrapServer"
              value: {{ .Values.bootstrapServer | quote }}
            - name: "KAFKA_SECURITY_PROTOCOL"
              value: {{ .Values.KAFKA_SECURITY_PROTOCOL | quote }}
            - name: "KAFKA_SASL_MECHANISM"
              value: {{ .Values.KAFKA_SASL_MECHANISM | quote }}
            - name: "KAFKA_OAUTH_CLIENT_ID"
              value: {{ .Values.KAFKA_OAUTH_CLIENT_ID | quote }}
            - name: "KAFKA_OAUTH_CLIENT_SECRET"
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kafkaOauthSecretName | default "dpn-keycloak-secrets" }}
                  key: KC_SERVICE_CLIENT_SECRET
            - name: "KAFKA_OAUTH_TOKEN_ENDPOINT_URL"
              value: {{ .Values.KAFKA_OAUTH_TOKEN_ENDPOINT_URL | quote }}
            - name: "KAFKA_SSL_CA_LOCATION"
              value: {{ .Values.KAFKA_SSL_CA_LOCATION | quote }}
            - name: "TRUSTSTORE_PASSWORD"
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.tlsAuthSecretName | default "tls-auth-secret" }}
                  key: TRUSTSTORE_PASSWORD
            - name: "KEYSTORE_PASSWORD"
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.tlsAuthSecretName | default "tls-auth-secret" }}
                  key: KEYSTORE_PASSWORD
            - name: "srcTopicName"
              value: {{ .Values.srcTopicName | quote }}
            - name: "srcGroupId"
              value: {{ .Values.srcGroupId | quote }}
            - name: "consumerRetryDelaySecs"
              value: {{ .Values.consumerRetryDelaySecs | quote }}
            - name: "producerFlushTimeoutSecs"
              value: {{ .Values.producerFlushTimeoutSecs | quote }}
            - name: "TOPIC_TASK_TIMEOUT_SECS"
              value: {{ .Values.TOPIC_TASK_TIMEOUT_SECS | quote }}
            - name: "orgName"
              value: {{ .Values.orgName | quote }}
            - name: "productType"
              value: {{ .Values.productType | quote }}
            - name: "SCHEDULER_BACKEND"
              value: {{ .Values.SCHEDULER_BACKEND | quote }}
            - name: "EXECUTION_MODE"
              value: {{ .Values.EXECUTION_MODE | quote }}
            - name: "PRODUCT_NAME"
              value: {{ .Values.PRODUCT_NAME | quote }}
            - name: "STATSD_HOST"
              value: {{ .Values.STATSD_HOST | quote }}
            - name: "STATSD_PORT"
              value: {{ .Values.STATSD_PORT | quote }}
            - name: "OTEL_EXPORTER_OTLP_ENDPOINT"
              value: {{ .Values.OTEL_EXPORTER_OTLP_ENDPOINT | quote }}
            - name: "OTEL_EXPORTER_OTLP_INSECURE"
              value: {{ .Values.OTEL_EXPORTER_OTLP_INSECURE | quote }}
            - name: "OTEL_OAUTH_DISABLED"
              value: {{ .Values.OTEL_OAUTH_DISABLED | quote }}
            - name: "SERVICE_NAME"
              value: {{ .Values.SERVICE_NAME | quote }}
            - name: "SERVICE_VERSION"
              value: {{ .Values.SERVICE_VERSION | quote }}
            - name: "ENVIRONMENT"
              value: {{ .Values.ENVIRONMENT | quote }}
          volumeMounts:
            - name: dpn-tls
              mountPath: /etc/secrets/truststore.jks
              subPath: truststore.jks
              readOnly: true
            - name: dpn-tls
              mountPath: /etc/secrets/keystore.jks
              subPath: keystore.jks
              readOnly: true
      volumes:
        - name: dpn-tls
          secret:
            secretName: {{ .Values.kafkaTlsSecretName | default "dpn-tls" }}
            optional: true
      automountServiceAccountToken: false

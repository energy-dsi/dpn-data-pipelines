namespace: ns-dpn-01
name: producer-file-mapper
cloudProviderType: azure
acrName: ""
imageName: producer-file-mapper-eq
imageTag: ""
productType: ""
secretName: eqbd-adaptor-secrets
bootstrapServer: dpn-kafka-src:9092
# ============================================================
# Kafka Security (SASL/TLS — SASL_SSL + SASL_OAUTHBEARER/Keycloak)
# build_kafka_client_config() reads these KAFKA_*/KAFKA_OAUTH_* vars.
# See README.md "Kafka Authentication" section for full details.
# ============================================================
KAFKA_SECURITY_PROTOCOL: SASL_SSL    # SASL authentication over TLS (set to SSL or PLAINTEXT to opt out)
KAFKA_SASL_MECHANISM: OAUTHBEARER    # OAuth2 client-credentials via Keycloak
KAFKA_OAUTH_CLIENT_ID: dpn-service-client        # Keycloak service-account client
KAFKA_OAUTH_TOKEN_ENDPOINT_URL: https://dpn-keycloak.ns-dpn-01.svc.cluster.local:8443/realms/dpn-observability/protocol/openid-connect/token
# Supplied from AKV in the dev environment. Uncomment (here and in
# templates/deployment.yaml) to pin the CA path in the chart instead.
# KAFKA_SSL_CA_LOCATION: /certs/ca.crt # CA cert that signed the broker certificate; mounted from kafkaCaConfigMapName below

# KAFKA_OAUTH_CLIENT_SECRET is never stored here. It is injected via a
# Kubernetes Secret (templates/secret.yaml), referenced through secretKeyRef.
# Provide it via --set kafkaOauthClientSecret=<secret>, or pre-create a
# Secret named <kafkaOauthSecretName> (default "<name>-kafka-oauth") with a
# "client-secret" key and leave kafkaOauthClientSecret unset.
kafkaOauthClientSecret: ""
kafkaOauthSecretName: ""   # defaults to "<name>-kafka-oauth" when empty
kafkaCaConfigMapName: ""   # defaults to "<name>-kafka-ca" when empty
srcContainerName: eq-stage
storageConnectionSecret: producer-file-dp-secret
mapperTopicName: dpn-producer-eq-raw
mapperContainerName: eq-raw
targetTopicName: dpn-producer-eq-target
targetContainerName: eq-target
scheduleInterval: 60  # schedule interval in seconds
orgName: EQ
schemaType: ""

SCHEDULER_BACKEND : kafka-trigger
EXECUTION_MODE: manual
PRODUCT_NAME: eq
PIPELINE_CONTROL_TOPIC: dpn-pipeline-control
PIPELINE_STATUS_TOPIC: dpn-pipeline-status
STATSD_HOST: ''
STATSD_PORT : 8125
# ------- AWS Config ------------
awsEndpointUrl: "<<your specific value>>"
awsRegion: us-east-1
awsAccessSecret: aws-access-secret
OTEL_EXPORTER_OTLP_ENDPOINT: dpn-otel-collector.ns-dpn-health-01.svc.cluster.local:4317
OTEL_EXPORTER_OTLP_PROTOCOL: grpc
OTEL_EXPORTER_OTLP_INSECURE: true
SERVICE_NAME: dpn data pipeline
SERVICE_VERSION: 1.0.0
ENVIRONMENT: development
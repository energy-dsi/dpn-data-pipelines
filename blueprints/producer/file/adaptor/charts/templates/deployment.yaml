apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.name }}
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: {{ .Values.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.name }}
    spec:
      restartPolicy: Always
      containers:
        - name: {{ .Values.name }}
          # No per-product tag suffix: this is the generic image — one
          # image serves every data product on this pathway.
          image: "{{ .Values.acrName }}.azurecr.io/dsi/{{ .Values.imageName }}:{{ .Values.imageTag }}"
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
            runAsUser: 10000
            runAsNonRoot: true
          command: ['python', 'main.py']
          env:
            - name: "scheduleInterval"
              value: {{ .Values.scheduleInterval | quote }}
            - name: "cloudProviderType"
              value: {{ .Values.cloudProviderType | quote }}
            - name: "targetTopicName"
              value: {{ .Values.targetTopicName | quote }}
            - name: "srcConnectionString"
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.storageConnectionSecret }}
                  key: SRC_CONNECTION_STRING
                  optional: true
            - name: "targetConnectionString"
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.storageConnectionSecret }}
                  key: TARGET_CONNECTION_STRING
                  optional: true
            - name: "srcContainerName"
              value: {{ .Values.srcContainerName | quote }}
            - name: "targetContainerName"
              value: {{ .Values.targetContainerName | quote }}
            - name: "bootstrapServer"
              value: {{ .Values.bootstrapServer | quote }}
            - name: "KAFKA_SECURITY_PROTOCOL"
              value: {{ .Values.KAFKA_SECURITY_PROTOCOL | quote }}
            - name: "KAFKA_SASL_MECHANISM"
              value: {{ .Values.KAFKA_SASL_MECHANISM | quote }}
            - name: "KAFKA_OAUTH_CLIENT_ID"
              value: {{ .Values.KAFKA_OAUTH_CLIENT_ID | quote }}
            - name: "KAFKA_OAUTH_CLIENT_SECRET"
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kafkaOauthSecretName | default "dpn-keycloak-secrets" }}
                  key: KC_SERVICE_CLIENT_SECRET
            - name: "KAFKA_OAUTH_TOKEN_ENDPOINT_URL"
              value: {{ .Values.KAFKA_OAUTH_TOKEN_ENDPOINT_URL | quote }}
            - name: "KAFKA_SSL_CA_LOCATION"
              value: {{ .Values.KAFKA_SSL_CA_LOCATION | quote }}
            - name: "TRUSTSTORE_PASSWORD"
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.tlsAuthSecretName | default "tls-auth-secret" }}
                  key: TRUSTSTORE_PASSWORD
            - name: "KEYSTORE_PASSWORD"
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.tlsAuthSecretName | default "tls-auth-secret" }}
                  key: KEYSTORE_PASSWORD
            - name: "productType"
              value: {{ .Values.productType | quote }}
            - name: "PRODUCT_NAME"
              value: {{ .Values.PRODUCT_NAME | quote }}
            - name: "orgName"
              value: {{ .Values.orgName | quote }}
            - name: "AWS_ENDPOINT_URL"
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.name }}-aws-config
                  key: AWS_ENDPOINT_URL
            - name: "AWS_REGION"
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.name }}-aws-config
                  key: AWS_REGION
            - name: "AWS_ACCESS_KEY_ID"
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.awsAccessSecret }}
                  key: AWS_ACCESS_KEY_ID
                  optional: true
            - name: "AWS_SECRET_ACCESS_KEY"
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.awsAccessSecret }}
                  key: AWS_SECRET_ACCESS_KEY
                  optional: true
            - name: "STATSD_HOST"
              value: {{ .Values.STATSD_HOST | quote }}
            - name: "STATSD_PORT"
              value: {{ .Values.STATSD_PORT | quote }}
            - name: "PIPELINE_CONTROL_TOPIC"
              value: {{ .Values.PIPELINE_CONTROL_TOPIC | quote }}
            - name: "PIPELINE_STATUS_TOPIC"
              value: {{ .Values.PIPELINE_STATUS_TOPIC | quote }}
            - name: "SCHEDULER_BACKEND"
              value: {{ .Values.SCHEDULER_BACKEND | quote }}
            - name: "EXECUTION_MODE"
              value: {{ .Values.EXECUTION_MODE | quote }}
            - name: "OTEL_EXPORTER_OTLP_ENDPOINT"
              value: {{ .Values.OTEL_EXPORTER_OTLP_ENDPOINT | quote }}
            - name: "OTEL_EXPORTER_OTLP_INSECURE"
              value: {{ .Values.OTEL_EXPORTER_OTLP_INSECURE | quote }}
            - name: "OTEL_OAUTH_DISABLED"
              value: {{ .Values.OTEL_OAUTH_DISABLED | quote }}
            - name: "SERVICE_NAME"
              value: {{ .Values.SERVICE_NAME | quote }}
            - name: "SERVICE_VERSION"
              value: {{ .Values.SERVICE_VERSION | quote }}
            - name: "ENVIRONMENT"
              value: {{ .Values.ENVIRONMENT | quote }}
          volumeMounts:
            - name: dpn-tls
              mountPath: /etc/secrets/truststore.jks
              subPath: truststore.jks
              readOnly: true
            - name: dpn-tls
              mountPath: /etc/secrets/keystore.jks
              subPath: keystore.jks
              readOnly: true
      volumes:
        - name: dpn-tls
          secret:
            secretName: {{ .Values.kafkaTlsSecretName | default "dpn-tls" }}
            optional: true
      automountServiceAccountToken: false

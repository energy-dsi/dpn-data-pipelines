{{- if and (eq .Values.cloudProviderType "aws") .Values.serviceAccount.create }}
# =============================================================================
# ServiceAccount — IRSA binding for AWS S3 access.
# The role ARN's trust policy must scope sts:AssumeRoleWithWebIdentity to
# system:serviceaccount:<namespace>:<this-name>.
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Values.namespace }}
  annotations:
    eks.amazonaws.com/role-arn: "{{ .Values.serviceAccount.irsaRoleArn }}"
{{- end }}

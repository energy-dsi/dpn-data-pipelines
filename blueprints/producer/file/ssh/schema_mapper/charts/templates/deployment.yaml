apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.name }}
spec:
  selector: 
    matchLabels:
      app: {{ .Values.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.name }}
    spec:
      restartPolicy: Always
      containers:
        - name: {{ .Values.name }}
          image: "{{ .Values.acrName }}.azurecr.io/dsi/{{ .Values.imageName }}:{{ .Values.imageTag }}-{{ .Values.productType }}"
          imagePullPolicy: Always
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
            runAsUser: 10000
            runAsNonRoot: true
          command: ['python', 'main.py']
          env:
            - name: "scheduleInterval"
              value: {{ .Values.scheduleInterval | quote }}
            - name: "cloudProviderType"
              value: {{ .Values.cloudProviderType | quote }}
            - name: "targetTopicName"
              value: {{ .Values.targetTopicName | quote }}
            - name: "mapperTopicName"
              value: {{ .Values.mapperTopicName | quote }}
            - name: "targetConnectionString"
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.storageConnectionSecret }}
                  key: TARGET_CONNECTION_STRING
            - name: "srcConnectionString"
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.storageConnectionSecret }}
                  key: SRC_CONNECTION_STRING
            - name: "srcContainerName"
              value: {{ .Values.srcContainerName | quote }}
            - name: "targetContainerName"
              value: {{ .Values.targetContainerName | quote }}
            - name: "mapperContainerName"
              value: {{ .Values.mapperContainerName | quote }}
            - name: "bootstrapServer"
              value: {{ .Values.bootstrapServer | quote }}
            - name: "productType"
              value: {{ .Values.productType | quote }}
            - name: "orgName"
              value: {{ .Values.orgName | quote }}
            - name: "schemaType"
              value: {{ .Values.schemaType | quote }}
            - name: "mapperConnectionString"
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.storageConnectionSecret }}
                  key: MAPPER_CONNECTION_STRING
            - name: "AWS_ENDPOINT_URL"
              value: {{ .Values.awsEndpointUrl | quote }}
            - name: "AWS_REGION"
              value: {{ .Values.awsRegion | quote }}
            - name: "AWS_ACCESS_KEY_ID"
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.awsAccessSecret }}
                  key: AWS_ACCESS_KEY_ID
            - name: "AWS_SECRET_ACCESS_KEY"
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.awsAccessSecret }}
                  key: AWS_SECRET_ACCESS_KEY

            - name: "SCHEDULER_BACKEND"
              value: {{ .Values.SCHEDULER_BACKEND | quote }}
            - name: "EXECUTION_MODE"
              value: {{ .Values.EXECUTION_MODE | quote }}
            - name: "PRODUCT_NAME"
              value: {{ .Values.PRODUCT_NAME | quote }}
            - name: "PIPELINE_CONTROL_TOPIC"
              value: {{ .Values.PIPELINE_CONTROL_TOPIC | quote }}
            - name: "PIPELINE_STATUS_TOPIC"
              value: {{ .Values.PIPELINE_STATUS_TOPIC | quote }}
            - name: "STATSD_HOST"
              value: {{ .Values.STATSD_HOST | quote }}
            - name: "STATSD_PORT"
              value: {{ .Values.STATSD_PORT | quote }}
            - name: "OTEL_EXPORTER_OTLP_ENDPOINT"
              value: {{ .Values.OTEL_EXPORTER_OTLP_ENDPOINT | quote }}
            - name: "OTEL_EXPORTER_OTLP_PROTOCOL"
              value: {{ .Values.OTEL_EXPORTER_OTLP_PROTOCOL | quote }}
            - name: "OTEL_EXPORTER_OTLP_INSECURE"
              value: {{ .Values.OTEL_EXPORTER_OTLP_INSECURE | quote | quote }}
            - name: "SERVICE_NAME"
              value: {{ .Values.SERVICE_NAME | quote }}
            - name: "SERVICE_VERSION"
              value: {{ .Values.SERVICE_VERSION | quote }}
            - name: "ENVIRONMENT"
              value: {{ .Values.ENVIRONMENT | quote }}

      automountServiceAccountToken: false

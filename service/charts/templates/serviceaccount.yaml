apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  {{- if and (eq .Values.env.DPN_CLOUD_PROVIDER "aws") .Values.serviceAccount.irsaRoleArn }}
  annotations:
    eks.amazonaws.com/role-arn: "{{ .Values.serviceAccount.irsaRoleArn }}"
  {{- end }}
automountServiceAccountToken: true

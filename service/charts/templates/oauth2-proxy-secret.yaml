{{- if .Values.oauth2Proxy.enabled }}
{{/*
The ONLY Secret this chart generates for oauth2-proxy, holding one value:
cookie-secret, the AES key oauth2-proxy encrypts the session cookie with.
oauth2-proxy refuses to start without it, but nothing outside this pod ever
needs to know it, so it's generated here rather than carried around as one
more credential to provision.

The Keycloak client credential is NOT here — it's read straight from the
Secret kafkaOauthSecretName already points at (see
oauth2-proxy-deployment.yaml), the same one that already exists for Kafka
OAuth. This chart never creates, modifies, or owns that Secret.

Generated ONCE and then reused: `lookup` reads the value back from the
Secret a previous release created, so `helm upgrade` never mints a new key
and logs everyone out. Delete this Secret by hand to rotate it deliberately.

(During `helm template`, with no cluster to look up against, a throwaway
value renders instead — that output is only ever inspected, never applied.)
*/}}
{{- $cookie := randAlphaNum 32 -}}
{{- $existing := lookup "v1" "Secret" .Values.namespace (printf "%s-oauth2-proxy-cookie" .Values.name) -}}
{{- if $existing -}}
{{-   $previous := index (default dict $existing.data) "cookie-secret" -}}
{{-   if $previous -}}
{{-     $cookie = b64dec $previous -}}
{{-   end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.name }}-oauth2-proxy-cookie
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.name }}-oauth2-proxy
type: Opaque
stringData:
  cookie-secret: {{ $cookie | quote }}
{{- end }}

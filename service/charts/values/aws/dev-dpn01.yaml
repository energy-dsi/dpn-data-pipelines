namespace: ns-dpn-dp-01
producerNamespace: ns-dpn-dp-01

imageRegistry: <<your specific value>>
imagePullSecretName: ghcr-pull-secret
imageName: dpn-self-service
imageTag: "1.0.1"

serviceAccount:
  irsaRoleArn: "<<your specific value>>"

env:
  DPN_NAMESPACE: ns-dpn-dp-01
  DPN_PRODUCER_SERVICE_ACCOUNT: dpn-self-service
  DPN_CLOUD_PROVIDER: aws
  DPN_IMAGE_REGISTRY: <<your specific value>>
  DPN_IMAGE_TAG: latest
  DPN_REGISTRY_BACKUP_CONTAINER: <<your specific value>>

awsRegion: eu-west-2
awsEndpointUrl: "https://s3.eu-west-2.amazonaws.com"

loadBalancer:
  enabled: true
  internal: true
  cloud: aws

persistence:
  enabled: true
  size: 1Gi
  storageClassName: gp3

oauth2Proxy:
  keycloak:
    publicUrl: "https://dpn-keycloak.ns-dpn-01.svc.cluster.local:8443"
    internalUrl: "https://dpn-keycloak.ns-dpn-01.svc.cluster.local:8443"
